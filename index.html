<title>かなクエスト・假名冒險 — JLPT N5 五十音・單字學習</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --indigo:#26456b; --indigo-2:#35608f; --vermil:#d64524; --gold:#d99a2b;
    --good:#2f8f57; --bad:#c33b34;
    --ground:#eef1f6; --card:#fbfaf6; --card-edge:#e3e0d5;
    --ink:#1b2436; --ink-soft:#566076; --line:#d7dbe4; --shadow:rgba(27,36,54,.14);
    --font-ui: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --font-kana: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "YuGothic", "Noto Sans JP", "Meiryo", sans-serif;
    --r:14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ground:#141a26; --card:#20293a; --card-edge:#2c3752; --ink:#eef1f7; --ink-soft:#9aa6bd;
      --line:#2c3547; --shadow:rgba(0,0,0,.4); --indigo:#7aa6d6; --indigo-2:#5b86bb; --vermil:#f2704e;
      --gold:#e7b653; --good:#4bbd7c; --bad:#ef6a63; }
  }
  :root[data-theme="light"] { --ground:#eef1f6; --card:#fbfaf6; --card-edge:#e3e0d5; --ink:#1b2436;
    --ink-soft:#566076; --line:#d7dbe4; --shadow:rgba(27,36,54,.14); --indigo:#26456b; --indigo-2:#35608f;
    --vermil:#d64524; --gold:#d99a2b; --good:#2f8f57; --bad:#c33b34; }
  :root[data-theme="dark"] { --ground:#141a26; --card:#20293a; --card-edge:#2c3752; --ink:#eef1f7;
    --ink-soft:#9aa6bd; --line:#2c3547; --shadow:rgba(0,0,0,.4); --indigo:#7aa6d6; --indigo-2:#5b86bb;
    --vermil:#f2704e; --gold:#e7b653; --good:#4bbd7c; --bad:#ef6a63; }

  * { box-sizing:border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--font-ui);
    line-height:1.5; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:860px; margin:0 auto; padding:0 16px 64px; }

  header { position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--ground) 88%, transparent);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .bar { max-width:860px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; margin-right:auto; }
  .seal { width:38px; height:38px; border-radius:9px; background:var(--vermil); color:#fff; display:grid;
    place-items:center; font-family:var(--font-kana); font-weight:700; font-size:22px;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.25); flex:none; }
  .brand b { font-size:15px; display:block; }
  .brand span { font-size:11.5px; color:var(--ink-soft); letter-spacing:.12em; text-transform:uppercase; }
  .stats { display:flex; align-items:center; gap:8px; font-variant-numeric:tabular-nums; }
  .stat { display:flex; align-items:center; gap:5px; background:var(--card); border:1px solid var(--card-edge);
    border-radius:999px; padding:5px 11px; font-weight:700; font-size:13px; }
  .ring { width:40px; height:40px; flex:none; position:relative; }
  .ring svg { transform:rotate(-90deg); }
  .ring i { position:absolute; inset:0; display:grid; place-items:center; font-size:10.5px; font-weight:800;
    font-style:normal; font-variant-numeric:tabular-nums; }

  .tabs { display:flex; gap:6px; margin:18px 0 14px; }
  .tab { flex:1; padding:10px 6px; border:1px solid var(--card-edge); background:var(--card); border-radius:12px;
    font:inherit; font-weight:700; color:var(--ink-soft); cursor:pointer; transition:.15s; font-size:14px; }
  .tab .jp { font-family:var(--font-kana); font-size:11px; display:block; opacity:.7; margin-top:1px; }
  .tab[aria-selected="true"] { background:var(--indigo); color:#fff; border-color:var(--indigo); box-shadow:0 4px 14px var(--shadow); }
  .tab:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }

  .groups { display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
  .gcluster { display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
  .glabel { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft);
    font-weight:800; margin-right:2px; }
  .chip { padding:7px 13px; border-radius:999px; border:1.5px solid var(--card-edge); background:transparent;
    color:var(--ink-soft); font:inherit; font-weight:600; font-size:12.5px; cursor:pointer; transition:.15s; }
  .chip[aria-pressed="true"] { background:color-mix(in srgb,var(--indigo) 14%, transparent);
    border-color:var(--indigo); color:var(--indigo); }
  .chip:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }

  .learn-hint { color:var(--ink-soft); font-size:13px; margin:0 0 12px; }

  /* 字表 */
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .cell { aspect-ratio:3/4; border:1px solid var(--card-edge); background:var(--card); border-radius:11px;
    cursor:pointer; display:grid; place-items:center; position:relative; transition:transform .12s, box-shadow .12s; padding:4px; }
  .cell:hover { transform:translateY(-2px); box-shadow:0 6px 16px var(--shadow); border-color:var(--indigo); }
  .cell:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  .cell.empty { visibility:hidden; }
  .cell .kk { font-family:var(--font-kana); font-size:clamp(22px,6vw,30px); font-weight:600; line-height:1; }
  .cell .rr { font-size:11px; color:var(--ink-soft); margin-top:5px; letter-spacing:.04em; font-weight:700; }
  .cell.on { background:var(--indigo); border-color:var(--indigo); }
  .cell.on .kk, .cell.on .rr { color:#fff; }

  /* 常錯記號（低調小點，錯越多越明顯） */
  .mark { position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%;
    background:var(--vermil); opacity:.5; box-shadow:0 0 0 2px color-mix(in srgb,var(--vermil) 22%, transparent); }
  .mark[data-lv="2"] { width:8px; height:8px; opacity:.75; }
  .mark[data-lv="3"] { width:9px; height:9px; opacity:1; }
  .cell.on .mark { background:#fff; box-shadow:0 0 0 2px rgba(255,255,255,.35); }

  .cell-detail { grid-column:1 / -1; background:color-mix(in srgb,var(--indigo) 8%, var(--card));
    border:1px solid var(--indigo); border-radius:var(--r); padding:16px 18px; display:flex; gap:16px;
    align-items:center; box-shadow:0 6px 18px var(--shadow); overflow:hidden; animation:drawer .22s ease; }
  @keyframes drawer { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
  .cell-detail .big { font-family:var(--font-kana); font-size:52px; line-height:1; font-weight:600; flex:none; width:66px; text-align:center; }
  .cell-detail .info b { font-size:19px; letter-spacing:.05em; }
  .cell-detail .info .rom { color:var(--vermil); font-weight:800; }
  .cell-detail .info p { margin:6px 0 0; color:var(--ink-soft); font-size:13.5px; }
  .speak { margin-left:auto; flex:none; border:none; background:var(--vermil); color:#fff; width:46px; height:46px;
    border-radius:50%; cursor:pointer; font-size:20px; display:grid; place-items:center;
    box-shadow:0 4px 12px var(--shadow); transition:transform .1s; }
  .speak:active { transform:scale(.9); }
  .speak:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }

  /* 單字清單 */
  .vlist { display:flex; flex-direction:column; gap:8px; }
  .vrow { position:relative; display:flex; align-items:center; gap:14px; background:var(--card);
    border:1px solid var(--card-edge); border-radius:12px; padding:12px 14px 12px 18px; }
  .vrow .vword { font-family:var(--font-kana); font-size:25px; font-weight:600; min-width:78px; }
  .vrow .vread { font-family:var(--font-kana); color:var(--indigo); font-size:14px; min-width:96px; }
  .vrow .vmean { color:var(--ink); font-size:15px; margin-right:auto; }
  .vrow .mark { top:8px; left:7px; right:auto; }
  .vrow .speak { width:40px; height:40px; font-size:17px; }

  /* 閃卡 */
  .flash-area { display:grid; place-items:center; gap:18px; padding:8px 0; }
  .fcard { width:min(280px,82vw); aspect-ratio:3/4; perspective:1200px; cursor:pointer; border:none; background:none; padding:0; }
  .fcard:focus-visible { outline:3px solid var(--gold); outline-offset:4px; border-radius:18px; }
  .fcard .inner { position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; }
  .fcard.flip .inner { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; backface-visibility:hidden; border-radius:18px; display:grid;
    place-items:center; box-shadow:0 10px 30px var(--shadow); border:1px solid var(--card-edge); padding:12px; text-align:center; }
  .face.front { background:var(--card); }
  .face.front .kk { font-family:var(--font-kana); font-weight:600; line-height:1.05; }
  .face.front .tap { position:absolute; bottom:16px; font-size:12px; color:var(--ink-soft); }
  .face.back { background:var(--indigo); color:#fff; transform:rotateY(180deg); }
  .face.back .rom { font-weight:800; letter-spacing:.02em; }
  .face.back .mean { font-size:22px; margin-top:8px; opacity:.95; }
  .face.back .lbl { font-size:12px; opacity:.75; margin-top:6px; }
  .flash-ctrl { display:flex; gap:10px; }
  .btn { border:none; border-radius:12px; padding:12px 20px; font:inherit; font-weight:700; font-size:15px;
    cursor:pointer; transition:transform .1s, filter .15s; }
  .btn:active { transform:scale(.96); }
  .btn:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  .btn.ghost { background:var(--card); border:1.5px solid var(--card-edge); color:var(--ink-soft); }
  .btn.know { background:var(--good); color:#fff; }
  .btn.dunno { background:var(--card); border:1.5px solid var(--vermil); color:var(--vermil); }
  .flash-count { color:var(--ink-soft); font-size:13px; font-variant-numeric:tabular-nums; }

  /* 測驗 */
  .quiz { display:grid; gap:14px; }
  .weak-banner { display:none; align-items:center; gap:10px; background:color-mix(in srgb,var(--vermil) 12%, var(--card));
    border:1px solid var(--vermil); border-radius:10px; padding:8px 12px; font-size:13px; font-weight:700; color:var(--vermil); }
  .weak-banner.show { display:flex; }
  .weak-banner button { margin-left:auto; border:none; background:var(--vermil); color:#fff; border-radius:8px;
    padding:5px 10px; font:inherit; font-weight:700; font-size:12px; cursor:pointer; }
  .quiz-top { display:flex; align-items:center; gap:12px; }
  .progress-bar { flex:1; height:9px; background:var(--card-edge); border-radius:999px; overflow:hidden; }
  .progress-bar i { display:block; height:100%; background:var(--indigo); width:0; transition:width .3s; }
  .combo { font-weight:800; color:var(--vermil); font-size:14px; font-variant-numeric:tabular-nums; min-width:56px; text-align:right; }
  .prompt { position:relative; background:var(--card); border:1px solid var(--card-edge); border-radius:var(--r);
    padding:30px 18px; text-align:center; box-shadow:0 6px 20px var(--shadow); overflow:hidden; }
  .prompt .ask { font-size:12.5px; color:var(--ink-soft); letter-spacing:.08em; }
  .prompt .q { font-family:var(--font-kana); font-size:clamp(48px,15vw,84px); font-weight:600; line-height:1.08; margin-top:6px; }
  .prompt.q-latin .q { font-family:var(--font-ui); font-weight:800; letter-spacing:.03em; font-size:clamp(30px,9vw,52px); }
  .stamp { position:absolute; top:50%; left:50%; width:118px; height:118px; border-radius:50%;
    border:5px solid var(--vermil); color:var(--vermil); display:grid; place-items:center;
    font-family:var(--font-kana); font-size:60px; font-weight:700;
    transform:translate(-50%,-50%) scale(0) rotate(-18deg); opacity:0; pointer-events:none; }
  .stamp.show { animation:stamp .5s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes stamp { 0%{transform:translate(-50%,-50%) scale(1.7) rotate(-18deg);opacity:0} 40%{opacity:.95} 100%{transform:translate(-50%,-50%) scale(1) rotate(-12deg);opacity:.92} }
  .options { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .opt { padding:16px 10px; border:1.5px solid var(--card-edge); background:var(--card); color:var(--ink);
    border-radius:12px; font:inherit; font-weight:800; font-size:19px; cursor:pointer; transition:.12s; min-height:58px; }
  .opt .oj { font-family:var(--font-kana); font-size:27px; }
  .opt:hover:not(:disabled) { border-color:var(--indigo); transform:translateY(-2px); }
  .opt:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  .opt.correct { background:var(--good); border-color:var(--good); color:#fff; }
  .opt.wrong { background:var(--bad); border-color:var(--bad); color:#fff; }
  .opt:disabled { cursor:default; }
  .shake { animation:shake .35s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-7px)} 40%,80%{transform:translateX(7px)} }
  .quiz-msg { text-align:center; min-height:22px; font-weight:700; font-size:14px; }

  /* 弱點統計 */
  .weak-sum { display:flex; gap:10px; margin-bottom:16px; }
  .weak-sum .box { flex:1; background:var(--card); border:1px solid var(--card-edge); border-radius:12px;
    padding:12px 8px; text-align:center; }
  .weak-sum .box b { font-size:22px; display:block; font-variant-numeric:tabular-nums; }
  .weak-sum .box span { font-size:11.5px; color:var(--ink-soft); }
  .weak-actions { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .weak-list { display:flex; flex-direction:column; gap:8px; }
  .weak-item { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--card-edge);
    border-radius:12px; padding:10px 14px; }
  .weak-item .wf { font-family:var(--font-kana); font-size:23px; font-weight:600; min-width:58px; }
  .weak-item .wr { color:var(--ink-soft); font-size:13px; }
  .weak-item .wr b { color:var(--indigo); font-weight:700; }
  .weak-item .wc { margin-left:auto; color:var(--vermil); font-weight:800; font-size:13px; white-space:nowrap; }
  .weak-empty { text-align:center; color:var(--ink-soft); padding:44px 20px; font-size:14px; line-height:1.8; }

  .btn.solid { background:var(--vermil); color:#fff; }
  .btn.line { background:var(--card); border:1.5px solid var(--card-edge); color:var(--ink-soft); }
  .toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); background:var(--ink);
    color:var(--ground); padding:11px 20px; border-radius:999px; font-weight:700; font-size:14px; opacity:0;
    pointer-events:none; transition:.3s; z-index:50; box-shadow:0 8px 24px var(--shadow); }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .rank-banner { display:flex; align-items:center; gap:12px; background:color-mix(in srgb,var(--gold) 16%, var(--card));
    border:1px solid color-mix(in srgb,var(--gold) 40%, var(--card-edge)); border-radius:var(--r); padding:12px 16px;
    margin-bottom:18px; font-size:13.5px; }
  .rank-banner .r-emoji { font-size:22px; }
  .rank-banner b { color:var(--ink); }
  .foot { text-align:center; color:var(--ink-soft); font-size:12px; margin-top:30px; line-height:1.7; }
  [hidden] { display:none !important; }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>

<header>
  <div class="bar">
    <div class="brand">
      <div class="seal">仮</div>
      <div><b>かなクエスト</b><span>假名冒險 · N5</span></div>
    </div>
    <div class="stats">
      <div class="stat" title="連續答對"><span>🔥</span><span id="s-streak">0</span></div>
      <div class="stat" title="累積經驗值"><span>⭐</span><span id="s-xp">0</span></div>

</header>

<div class="wrap">
  <div class="rank-banner">
    <span class="r-emoji" id="rank-emoji">🌱</span>

  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-view="learn">學習<span class="jp">まなぶ</span></button>
    <button class="tab" role="tab" aria-selected="false" data-view="flash">閃卡<span class="jp">カード</span></button>
    <button class="tab" role="tab" aria-selected="false" data-view="quiz">測驗<span class="jp">クイズ</span></button>
    <button class="tab" role="tab" aria-selected="false" data-view="weak">弱點<span class="jp">よわてん</span></button>

  <!-- 學習 -->
  <section id="view-learn">

  <!-- 閃卡 -->

      </div>

  <!-- 測驗 -->
  <section id="view-quiz" hidden>
    <div class="quiz">
      <div class="weak-banner" id="weak-banner">
        <span id="weak-banner-txt">🎯 弱點練習中</span>
        <button id="weak-clear">回一般模式</button>
      </div>
      <div class="quiz-top">
        <div class="progress-bar"><i id="q-prog"></i></div>
        <div class="combo" id="q-combo"></div>
      </div>
      <div class="prompt" id="q-prompt">
        <div class="ask" id="q-ask">這個假名怎麼唸？</div>
        <div class="q" id="q-main">あ</div>
        <div class="stamp" id="q-stamp">正</div>
      </div>
      <div class="options" id="q-opts"></div>
      <div class="quiz-msg" id="q-msg"></div>

  </section>

  <!-- 弱點統計 -->
  <section id="view-weak" hidden>
    <div class="weak-sum">
      <div class="box"><b id="w-total">0</b><span>總作答</span></div>
      <div class="box"><b id="w-acc">—</b><span>正確率</span></div>
      <div class="box"><b id="w-count">0</b><span>常錯項目</span></div>
    </div>
    <div class="weak-actions" id="weak-actions"></div>
    <div class="weak-list" id="weak-list"></div>
  </section>

  <div class="foot">
    かなクエスト · JLPT N5 五十音 × 單字 ·<br>
    點項目可用瀏覽器內建日語語音發音；常認錯的項目會標上小紅點，進度自動存在本機。
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ===================== 資料 ===================== */
const HS = [
  ['あ','a','像「安」草寫'],['い','i','兩撇，像「以」'],['う','u','像「宇」的上半'],['え','e','像「衣」'],['お','o','像「於」，右上一點'],
  ['か','ka','「加」的左半＋一點'],['き','ki','像鑰匙 key'],['く','ku','像鳥嘴'],['け','ke','「計」的左半'],['こ','ko','兩橫，像「己」'],
  ['さ','sa','像「左」'],['し','shi','一勾到底，像釣竿'],['す','su','像打結的繩'],['せ','se','像「世」'],['そ','so','像閃電'],
  ['た','ta','像「太」'],['ち','chi','像數字 5 反過來'],['つ','tsu','像海浪／微笑'],['て','te','像「天」的一撇'],['と','to','像被釘子刺的腳趾 toe'],

/* 建立標準化 item，並做全域 id→item 索引 */
function itemsOf(key){
  const g=GROUPS[key];
  if(g.type==='kana') return g.data.map(x=>({id:'k:'+x[0], type:'kana', front:x[0], read:x[1], hint:x[2]||''}));
  return g.data.map(x=>({id:'v:'+x[0], type:'vocab', front:x[0], read:x[1], meaning:x[2]}));
}
const ALL = {};
for(const k in GROUPS) itemsOf(k).forEach(it=>{ ALL[it.id]=it; });

/* ===================== 進度 ===================== */
const KEY='kanaQuest.v2';
const today=()=>new Date().toISOString().slice(0,10);
let P=load();
function load(){
  let d={}; try{ d=JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){}
  d.xp=d.xp||0; d.best=d.best||0;
  if(d.dailyDate!==today()){ d.dailyDate=today(); d.dailyCount=0; }
  d.dailyCount=d.dailyCount||0;
  d.stats=d.stats||{};   // id -> {s:seen, w:wrong}
  return d;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(e){} }
function stat(id){ return P.stats[id] || {s:0,w:0}; }
function bumpStat(id, wrong){
  const s=P.stats[id] || {s:0,w:0};
  s.s++; if(wrong) s.w++;
  P.stats[id]=s; save();
}
function markLevel(w){ return w>=4?3 : w>=2?2 : 1; }

const RANKS=[[0,'假名新手','🌱'],[150,'假名見習','📖'],[400,'假名冒險者','🗺️'],[800,'假名達人','🎴'],[1500,'假名忍者','🥷'],[2600,'假名大師','🏯']];
function rank(xp){ let r=RANKS[0]; for(const x of RANKS){ if(xp>=x[0]) r=x; } return r; }
function nextRank(xp){ for(const x of RANKS){ if(xp<x[0]) return x; } return null; }

/* ===================== 發音 ===================== */
let jaVoice=null;
function pickVoice(){ const vs=speechSynthesis.getVoices(); jaVoice=vs.find(v=>/ja[-_]?JP/i.test(v.lang))||vs.find(v=>/^ja/i.test(v.lang))||null; }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function say(text){ if(!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='ja-JP'; if(jaVoice) u.voice=jaVoice; u.rate=.82; speechSynthesis.speak(u);}catch(e){} }
function speakItem(it){ say(it.type==='vocab' ? it.read : it.front); }

function pool(){ let a=[]; for(const g of selected) a=a.concat(itemsOf(g)); return a; }

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1500); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

let curCols=5;
function renderLearn(){
  const t=firstType();
  $('chart').hidden = t!=='kana';
  $('vlist').hidden = t!=='vocab';
  if(t==='kana'){ $('learn-hint').textContent='👆 點任一個假名，會在下方展開發音與記憶口訣（再點一次收合）。'; renderChart(); }
  else { $('learn-hint').textContent='👆 點單字可聽發音。常認錯的會標上小紅點。'; renderVlist(); }
}
function renderChart(){
  const key=[...selected].find(k=>GROUPS[k].type==='kana');
  const g=GROUPS[key]; curCols=g.cols;
  const chart=$('chart'); chart.style.gridTemplateColumns=`repeat(${g.cols},1fr)`; chart.innerHTML='';
  const items = g.layout==='gojuon' ? gojuonLayout(g.data) : g.data.map(x=>({k:x[0],r:x[1],h:x[2]}));
  items.forEach((it,i)=>{
    const c=document.createElement('button'); c.className='cell'; c.dataset.i=i;
    if(!it){ c.classList.add('empty'); c.disabled=true; chart.appendChild(c); return; }
    const w=stat('k:'+it.k).w;
    c.innerHTML=`<span class="kk">${it.k}</span><span class="rr">${it.r}</span>`+
      (w>0?`<span class="mark" data-lv="${markLevel(w)}" title="答錯 ${w} 次"></span>`:'');
    c.onclick=()=>toggleDetail(c,it,i);
    chart.appendChild(c);
  });
}
function gojuonLayout(data){
  const map={}; data.forEach(d=>map[d[1]]=d);
  const rows=[['a','i','u','e','o'],['ka','ki','ku','ke','ko'],['sa','shi','su','se','so'],
    ['ta','chi','tsu','te','to'],['na','ni','nu','ne','no'],['ha','hi','fu','he','ho'],
    ['ma','mi','mu','me','mo'],['ya',null,'yu',null,'yo'],['ra','ri','ru','re','ro'],
    ['wa',null,null,null,'wo'],[null,null,'n',null,null]];
  const out=[]; for(const row of rows) for(const r of row){ out.push(r&&map[r]?{k:map[r][0],r:map[r][1],h:map[r][2]}:null); } return out;
}
function toggleDetail(cell,it,i){
  const chart=$('chart'); const isOpen=cell.classList.contains('on');
  document.querySelectorAll('.cell.on').forEach(e=>e.classList.remove('on'));
  const old=chart.querySelector('.cell-detail'); if(old) old.remove();
  if(isOpen) return;
  cell.classList.add('on'); say(it.k);
  const cells=chart.querySelectorAll('.cell');
  const row=Math.floor(i/curCols);
  const endIdx=Math.min((row+1)*curCols-1, cells.length-1);
  const anchor=chart.querySelector('.cell[data-i="'+endIdx+'"]');
  const w=stat('k:'+it.k).w;
  const d=document.createElement('div'); d.className='cell-detail';
  d.innerHTML=`<div class="big">${it.k}</div>
     <div class="info"><b>唸作 <span class="rom">${it.r}</span></b>
       <p>${it.h?'💡 '+it.h:'多唸幾次、跟著手寫，很快就記住！'}${w>0?` · <span style="color:var(--vermil);font-weight:700">曾答錯 ${w} 次</span>`:''}</p></div>
     <button class="speak" aria-label="發音">🔊</button>`;
  d.querySelector('.speak').onclick=(e)=>{ e.stopPropagation(); say(it.k); };
  anchor.after(d);
}
function renderVlist(){
  const box=$('vlist'); box.innerHTML='';
  for(const it of pool().filter(x=>x.type==='vocab')){
    const w=stat(it.id).w;
    const row=document.createElement('div'); row.className='vrow';
    row.innerHTML=(w>0?`<span class="mark" data-lv="${markLevel(w)}" title="答錯 ${w} 次"></span>`:'')+
      `<span class="vword">${it.front}</span><span class="vread">${it.read}</span>`+
      `<span class="vmean">${it.meaning}</span><button class="speak" aria-label="發音">🔊</button>`;
    row.querySelector('.speak').onclick=()=>say(it.read);
    box.appendChild(row);
  }
}

let deck=[], di=0;

function curCard(){ return deck[di%deck.length]; }
function showCard(){
  if(!deck.length) return;
  const c=curCard(); $('fcard').classList.remove('flip');
  $('f-front').textContent=c.front;
  $('f-front').style.fontSize = c.front.length>=3 ? '48px' : (c.type==='vocab'?'72px':'108px');

    ? `<div class="rom" style="font-family:var(--font-kana);font-size:46px">${c.read}</div><div class="mean">${c.meaning}</div>`
    : `<div class="rom" style="font-size:60px">${c.read}</div><div class="lbl">羅馬拼音</div>`;

/* ===================== 測驗 ===================== */
let cur=null, mode='k2r', locked=false;
function quizPool(){ return quizOverride && quizOverride.length ? quizOverride : pool(); }
function newQuestion(){
  const p=quizPool(); if(p.length<2){ return; }
  locked=false; cur=p[Math.random()*p.length|0];
  const prompt=$('q-prompt'); $('q-stamp').classList.remove('show');
  $('q-msg').textContent=''; $('q-msg').style.color='';
  let correct, optJP;
  if(cur.type==='kana'){
    mode=Math.random()<0.5?'k2r':'r2k';
    if(mode==='k2r'){ prompt.classList.remove('q-latin'); $('q-ask').textContent='這個假名怎麼唸？'; $('q-main').textContent=cur.front; correct=cur.read; optJP=false; }
    else { prompt.classList.add('q-latin'); $('q-ask').textContent='哪個是「'+cur.read+'」？'; $('q-main').textContent=cur.read; correct=cur.front; optJP=true; }
  } else {
    mode=Math.random()<0.5?'w2m':'m2w';
    if(mode==='w2m'){ prompt.classList.remove('q-latin'); $('q-ask').textContent='這個單字是什麼意思？'; $('q-main').textContent=cur.front; correct=cur.meaning; optJP=false; }
    else { prompt.classList.add('q-latin'); $('q-ask').textContent='「'+cur.meaning+'」是哪個？'; $('q-main').textContent=cur.meaning; correct=cur.front; optJP=true; }
  }
  const valOf=it=> mode==='k2r'?it.read : mode==='r2k'?it.front : mode==='w2m'?it.meaning : it.front;
  // 干擾選項取自同型題庫
  let bag=pool().filter(x=>x.type===cur.type);
  if(bag.length<4) bag=Object.values(ALL).filter(x=>x.type===cur.type);
  const opts=new Set([correct]); bag=shuffle(bag);
  for(const x of bag){ if(opts.size>=4) break; opts.add(valOf(x)); }
  const list=shuffle([...opts]);
  const box=$('q-opts'); box.innerHTML='';
  list.forEach(v=>{
    const b=document.createElement('button'); b.className='opt'; b.dataset.val=v;
    b.innerHTML = optJP ? `<span class="oj">${v}</span>` : v;
    b.onclick=()=>answer(b,correct);
    box.appendChild(b);
  });
  updateProg();
}
function answer(btn,correct){
  if(locked) return; locked=true;
  const ok = btn.dataset.val===correct;
  const buttons=[...$('q-opts').children];
  bumpStat(cur.id, !ok);
  if(ok){
    btn.classList.add('correct'); streak++; if(streak>P.best) P.best=streak;
    const bonus=streak>=3?Math.min(streak,8):0; P.xp+=10+bonus; P.dailyCount++;
    speakItem(cur); $('q-stamp').classList.add('show');
    $('q-msg').style.color='var(--good)';
    $('q-msg').textContent = streak>=3?`太強了！連勝 ${streak} 🔥 (+${10+bonus} XP)`:'答對！+10 XP';
    if(P.dailyCount===GOAL) toast('🎉 達成今日目標！你超讚！');
  } else {
    btn.classList.add('wrong','shake'); streak=0;
    buttons.forEach(b=>{ if(b.dataset.val===correct) b.classList.add('correct'); });
    speakItem(cur);
    $('q-msg').style.color='var(--bad)';
    $('q-msg').textContent = cur.type==='kana'
      ? `「${cur.front}」唸作 ${cur.read}，再記一次！`
      : `「${cur.front}」(${cur.read}) 是「${cur.meaning}」`;
  }
  buttons.forEach(b=>b.disabled=true);
  save(); renderStats(); updateProg();
  setTimeout(newQuestion, ok?850:1650);
}
function updateProg(){ $('q-combo').textContent = streak>1?('🔥 x'+streak):''; $('q-prog').style.width=Math.min(100,P.dailyCount/GOAL*100)+'%'; }
$('weak-clear').onclick=()=>{ quizOverride=null; $('weak-banner').classList.remove('show'); newQuestion(); };

function renderWeak(){
  const entries=Object.entries(P.stats).filter(([id,s])=>s.w>0 && ALL[id])
    .map(([id,s])=>({it:ALL[id], w:s.w, s:s.s})).sort((a,b)=> b.w-a.w || (b.w/b.s)-(a.w/a.s));
  let totalS=0, totalW=0; for(const id in P.stats){ totalS+=P.stats[id].s; totalW+=P.stats[id].w; }
  $('w-total').textContent=totalS;
  $('w-acc').textContent = totalS? Math.round((totalS-totalW)/totalS*100)+'%' : '—';
  $('w-count').textContent=entries.length;
  const act=$('weak-actions'); act.innerHTML='';
  const list=$('weak-list');
  if(!entries.length){
    list.innerHTML='<div class="weak-empty">還沒有答錯的紀錄 👍<br>先去「測驗」練幾題，這裡會自動整理出你最常認錯的字。</div>';
    return;
  }
  const btn=document.createElement('button'); btn.className='btn solid'; btn.textContent='🎯 只練這些弱點（'+entries.length+'）';
  btn.onclick=()=>{ quizOverride=entries.map(e=>e.it); streak=0;
    $('weak-banner-txt').textContent='🎯 弱點練習中 · 共 '+entries.length+' 項'; $('weak-banner').classList.add('show');
    switchTo('quiz'); newQuestion(); };
  act.appendChild(btn);
  const clr=document.createElement('button'); clr.className='btn line'; clr.textContent='清除紀錄';
  clr.onclick=()=>{ if(confirm('確定清除所有答錯紀錄？')){ P.stats={}; save(); renderWeak(); renderLearn(); } };
  act.appendChild(clr);
  list.innerHTML='';
  for(const e of entries){
    const row=document.createElement('div'); row.className='weak-item';
    const meaning = e.it.type==='vocab' ? ' · '+e.it.meaning : '';
    row.innerHTML=`<span class="wf">${e.it.front}</span>
      <span class="wr"><b>${e.it.read}</b>${meaning}</span>
      <span class="wc">錯 ${e.w} / ${e.s} 次</span>`;
    row.onclick=()=>speakItem(e.it);
    list.appendChild(row);
  }
}

/* ===================== 分頁 ===================== */
function switchTo(v){
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected', x.dataset.view===v));
  $('view-learn').hidden=v!=='learn'; $('view-flash').hidden=v!=='flash';
  $('view-quiz').hidden=v!=='quiz'; $('view-weak').hidden=v!=='weak';
  if(v==='learn') renderLearn();
  if(v==='flash') resetFlash();
  if(v==='quiz') newQuestion();
  if(v==='weak') renderWeak();
}
document.querySelectorAll('.tab').forEach(t=>{ t.onclick=()=>switchTo(t.dataset.view); });

/* ===================== 啟動 ===================== */
renderGroups(); renderLearn(); renderStats(); resetFlash(); newQuestion();
</script>
