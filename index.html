<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

  .quiz { display: grid; gap: 16px; }

  .prompt {

  .prompt .ask { font-size: 12.5px; color: var(--ink-soft); letter-spacing: .1em; text-transform: uppercase; }

  .prompt.romaji-q .q { font-family: var(--font-ui); font-weight: 800; letter-spacing: .05em; }
  .stamp {

    border: 5px solid var(--vermil); color: var(--vermil); display: grid; place-items: center;
    font-family: var(--font-kana); font-size: 60px; font-weight: 700;

  .stamp.show { animation: stamp .5s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes stamp { 0%{transform:translate(-50%,-50%) scale(1.7) rotate(-18deg);opacity:0} 40%{opacity:.95} 100%{transform:translate(-50%,-50%) scale(1) rotate(-12deg);opacity:.92} }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt {
    padding: 18px 10px; border: 1.5px solid var(--card-edge); background: var(--card); color: var(--ink);
    border-radius: 12px; font: inherit; font-weight: 800; font-size: 22px; cursor: pointer;
    transition: .12s; font-variant-numeric: tabular-nums;

  .opt .oj { font-family: var(--font-kana); font-size: 30px; }
  .opt:hover:not(:disabled) { border-color: var(--indigo); transform: translateY(-2px); }
  .opt:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .opt.correct { background: var(--good); border-color: var(--good); color: #fff; }
  .opt.wrong { background: var(--bad); border-color: var(--bad); color: #fff; }
  .opt:disabled { cursor: default; }
  .shake { animation: shake .35s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-7px)} 40%,80%{transform:translateX(7px)} }
  .quiz-msg { text-align: center; min-height: 22px; font-weight: 700; font-size: 14px; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--ground); padding: 11px 20px; border-radius: 999px;

  .rank-banner {

  .foot { text-align: center; color: var(--ink-soft); font-size: 12px; margin-top: 30px; line-height: 1.7; }

  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

  ks: { name:'片假名 清音', data: KS, cols:5, layout:'gojuon' },
  hd: { name:'濁音・半濁音', data: HD, cols:5, layout:'plain' },
  hy: { name:'拗音', data: HY, cols:3, layout:'plain' },
};

/* ===================== 進度（localStorage） ===================== */
const KEY = 'kanaQuest.v1';
const today = () => new Date().toISOString().slice(0,10);
let P = load();
function load(){
  let d = {};
  try { d = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){}
  d.xp = d.xp || 0; d.best = d.best || 0; d.correct = d.correct || 0;
  if (d.dailyDate !== today()) { d.dailyDate = today(); d.dailyCount = 0; }
  d.dailyCount = d.dailyCount || 0;
  return d;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e){} }

const RANKS = [
  [0,'假名新手','🌱'],[150,'假名見習','📖'],[400,'假名冒險者','🗺️'],
  [800,'假名達人','🎴'],[1500,'假名忍者','🥷'],[2600,'假名大師','🏯'],
];
function rank(xp){ let r=RANKS[0]; for(const x of RANKS){ if(xp>=x[0]) r=x; } return r; }
function nextRank(xp){ for(const x of RANKS){ if(xp<x[0]) return x; } return null; }

/* ===================== 語音發音 ===================== */
let jaVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  jaVoice = vs.find(v=>/ja[-_]?JP/i.test(v.lang)) || vs.find(v=>/^ja/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(kana){
  if(!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(kana);
    u.lang = 'ja-JP'; if(jaVoice) u.voice = jaVoice; u.rate = .8;
    speechSynthesis.speak(u);
  } catch(e){}
}

/* ===================== 狀態 ===================== */
let selected = new Set(['hs']);   // 選中的群組
let streak = 0;
const $ = id => document.getElementById(id);

/* ===================== 頁首更新 ===================== */
function renderStats(){
  $('s-streak').textContent = streak;
  $('s-xp').textContent = P.xp;
  const goal = 20, off = 100.5 * (1 - Math.min(P.dailyCount,goal)/goal);
  $('ring-fg').style.strokeDashoffset = off;
  $('ring-txt').textContent = Math.min(P.dailyCount,goal)+'/'+goal;
  const r = rank(P.xp), nx = nextRank(P.xp);
  $('rank-emoji').textContent = r[2]; $('rank-name').textContent = r[1];
  $('rank-next').textContent = nx ? ('再 '+(nx[0]-P.xp)+' XP 升「'+nx[1]+'」') : '已達最高段位！🎉';
}

/* ===================== 目前題庫 ===================== */
function pool(){
  let arr = [];
  for(const g of selected) arr = arr.concat(GROUPS[g].data.map(x=>({k:x[0], r:x[1]})));
  // 去除純重複（例如 じ/ぢ 同拼音仍保留為不同卡）
  return arr;
}
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1400);
}

/* ===================== 群組晶片 ===================== */
function renderGroups(){
  const box = $('groups'); box.innerHTML='';
  for(const key in GROUPS){
    const b=document.createElement('button');
    b.className='chip'; b.textContent=GROUPS[key].name;
    b.setAttribute('aria-pressed', selected.has(key));
    b.onclick=()=>{
      if(selected.has(key)){ if(selected.size>1) selected.delete(key); }
      else selected.add(key);
      renderGroups(); onGroupChange();
    };
    box.appendChild(b);
  }
}
function onGroupChange(){
  renderChart(); resetFlash(); newQuestion();
}

/* ===================== 學習：字表 ===================== */
function renderChart(){
  const chart=$('chart');
  // 學習模式只顯示「選中的第一個」群組，避免太雜
  const key = [...selected][0];
  const g = GROUPS[key];
  chart.style.gridTemplateColumns = `repeat(${g.cols}, 1fr)`;
  chart.innerHTML='';
  const items = g.layout==='gojuon' ? gojuonLayout(g.data) : g.data.map(x=>({k:x[0],r:x[1],h:x[2]}));
  for(const it of items){
    const c=document.createElement('button'); c.className='cell';
    if(!it){ c.classList.add('empty'); c.disabled=true; chart.appendChild(c); continue; }
    c.innerHTML=`<span class="kk">${it.k}</span><span class="rr">${it.r}</span>`;
    c.onclick=()=>{ document.querySelectorAll('.cell.on').forEach(e=>e.classList.remove('on'));
      c.classList.add('on'); showDetail(it); speak(it.k); };
    chart.appendChild(c);
  }
  $('detail').innerHTML='<div class="hint-empty">👆 點任一個假名，聽發音、看記憶口訣。</div>';
}
// 把清音排成 5 欄五十音矩陣（補空格對齊）
function gojuonLayout(data){
  const map={}; data.forEach(d=>map[d[1]]=d);
  const rows=[['a','i','u','e','o'],['ka','ki','ku','ke','ko'],['sa','shi','su','se','so'],
    ['ta','chi','tsu','te','to'],['na','ni','nu','ne','no'],['ha','hi','fu','he','ho'],
    ['ma','mi','mu','me','mo'],['ya',null,'yu',null,'yo'],['ra','ri','ru','re','ro'],
    ['wa',null,null,null,'wo'],[null,null,'n',null,null]];
  const out=[];
  for(const row of rows) for(const r of row){
    if(r && map[r]) out.push({k:map[r][0], r:map[r][1], h:map[r][2]});
    else out.push(null);
  }
  return out;
}
function showDetail(it){
  $('detail').innerHTML =
    `<div class="big">${it.k}</div>
     <div class="info"><b>唸作 <span class="rom">${it.r}</span></b>
       <p>${it.h ? '💡 '+it.h : '多唸幾次、跟著手寫，很快就記住！'}</p></div>
     <button class="speak" aria-label="發音">🔊</button>`;
  $('detail').querySelector('.speak').onclick=()=>speak(it.k);
}

/* ===================== 閃卡 ===================== */
let deck=[], di=0;
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function resetFlash(){ deck=shuffle(pool()); di=0; showCard(); }
function showCard(){
  if(!deck.length) return;
  const card=deck[di%deck.length];
  $('fcard').classList.remove('flip');
  $('f-kana').textContent=card.k; $('f-rom').textContent=card.r;
  $('f-count').textContent=`第 ${ (di%deck.length)+1 } / ${deck.length} 張`;
}
$('fcard').onclick=()=>$('fcard').classList.toggle('flip');
$('f-speak').onclick=()=>speak(deck[di%deck.length].k);
$('f-know').onclick=()=>{ addXP(2); toast('記住了 +2 XP 👍'); nextCard(); };
$('f-dunno').onclick=()=>{ speak(deck[di%deck.length].k); nextCard(); };
function nextCard(){ di++; if(di%deck.length===0) deck=shuffle(deck); showCard(); }

/* ===================== 測驗 ===================== */
let cur=null, mode='k2r', locked=false;
function newQuestion(){
  const p=pool(); if(p.length<4){ return; }
  locked=false;
  cur = p[Math.random()*p.length|0];
  mode = Math.random()<0.5 ? 'k2r' : 'r2k';   // 假名→拼音 或 拼音→假名
  const prompt=$('q-prompt');
  $('q-stamp').classList.remove('show');
  $('q-msg').textContent=''; $('q-msg').style.color='';
  if(mode==='k2r'){
    prompt.classList.remove('romaji-q');
    $('q-ask').textContent='這個假名怎麼唸？';
    $('q-kana').textContent=cur.k;
  } else {
    prompt.classList.add('romaji-q');
    $('q-ask').textContent='哪個是「'+cur.r+'」？';
    $('q-kana').textContent=cur.r;
  }
  // 選項
  const correct = mode==='k2r' ? cur.r : cur.k;
  const opts=new Set([correct]);
  const bag=p.slice();
  while(opts.size<4 && bag.length){
    const cand=bag[Math.random()*bag.length|0];
    opts.add(mode==='k2r'?cand.r:cand.k);
  }
  const list=shuffle([...opts]);
  const box=$('q-opts'); box.innerHTML='';
  list.forEach(o=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML = mode==='k2r' ? o : `<span class="oj">${o}</span>`;
    b.onclick=()=>answer(b,o,correct);
    box.appendChild(b);
  });
  updateProg();
}
function answer(btn,chosen,correct){
  if(locked) return; locked=true;
  const buttons=[...$('q-opts').children];
  if(chosen===correct){
    btn.classList.add('correct');
    streak++; if(streak>P.best) P.best=streak;
    const bonus = streak>=3 ? Math.min(streak,8) : 0;
    addXP(10+bonus); P.correct++; P.dailyCount++;
    if(mode==='k2r') speak(cur.k);
    $('q-stamp').classList.add('show');
    $('q-msg').style.color='var(--good)';
    $('q-msg').textContent = streak>=3 ? `太強了！連勝 ${streak} 🔥 (+${10+bonus} XP)` : '答對！+10 XP';
    if(P.dailyCount===20) toast('🎉 達成今日目標！你超讚！');
    save(); renderStats();
    setTimeout(newQuestion, 850);
  } else {
    btn.classList.add('wrong'); btn.classList.add('shake');
    streak=0;
    buttons.forEach(b=>{
      const v = mode==='k2r'? b.textContent : b.querySelector('.oj').textContent;
      if(v===correct) b.classList.add('correct');
    });
    if(mode==='k2r') speak(cur.k);
    $('q-msg').style.color='var(--bad)';
    $('q-msg').textContent = mode==='k2r'
      ? `「${cur.k}」唸作 ${cur.r}，再記一次！`
      : `「${cur.r}」是 ${cur.k}，加油！`;
    save(); renderStats();
    setTimeout(newQuestion, 1600);
  }
  buttons.forEach(b=>b.disabled=true);
  updateProg();
}
function addXP(n){ P.xp+=n; save(); renderStats(); }
function updateProg(){
  $('q-combo').textContent = streak>1 ? ('🔥 x'+streak) : '';
  const goal=20; $('q-prog').style.width = Math.min(100, P.dailyCount/goal*100)+'%';
}

/* ===================== 分頁切換 ===================== */
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));
    const v=t.dataset.view;
    $('view-learn').hidden = v!=='learn';
    $('view-flash').hidden = v!=='flash';
    $('view-quiz').hidden  = v!=='quiz';
    if(v==='flash') resetFlash();
    if(v==='quiz') newQuestion();
  };
});

/* ===================== 啟動 ===================== */
renderGroups(); renderChart(); renderStats(); resetFlash(); newQuestion();
</script>
